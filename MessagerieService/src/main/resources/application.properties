spring.application.name=MessagerieService


spring.jpa.show-sql=true
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
#Console accessible http://localhost:8080/h2-console et mettre l'URL choisi dans datasource.url
spring.h2.console.enabled=true
#Version en mêmoire vive
#spring.datasource.url=jdbc:h2:mem:testdb
#Version création de fichier il faut ddl-auto pour qu'il crée la base avec le fichier
spring.datasource.url=jdbc:h2:file:./testdb;AUTO_SERVER=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

#Si on veut charger data.sql au démarrage
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.profiles.active=local


spring.ai.google.genai.api-key=

#Choix du model
spring.ai.google.genai.chat.model=gemini-3.1-flash-lite

#Température (0.0 = très strict/analytique, 2.0 = créatif/imprévisible)
spring.ai.google.genai.chat.temperature=0.7

# (Optionnel) max-tokens si on veut limiter la taille des réponses
spring.ai.google.genai.chat.max-output-tokens=800

