<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Spring Boot Thymeleaf Example</title>
    <link href="/css/main.css" rel="stylesheet"/>
</head>
<body>
<h1 th:text=" ${message} + ' ' + ${student.name}"></h1>

<ol>
    <li th:each="student : ${list}" th:text="${student.name} + ':' + ${student.note}"> </li>
</ol>

</body>
</html>
